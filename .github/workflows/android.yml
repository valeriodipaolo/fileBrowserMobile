name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compila APK
        run: gradle assembleDebug --stacktrace

      - name: Impronta della firma (deve essere sempre uguale)
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256"
          echo "Keystore originale:"
          keytool -list -v -keystore debug.keystore -storepass android | grep -i "SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
