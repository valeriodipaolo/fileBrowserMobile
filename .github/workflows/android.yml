name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compila APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Impronta della firma (deve essere sempre uguale)
        run: |
          # minSdk 26: l'APK ha solo firme v2/v3, che keytool -jarfile non legge. Si usa apksigner.
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          echo "APK:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
          echo "Keystore originale:"
          keytool -list -v -keystore debug.keystore -storepass android | grep -i "SHA256"
